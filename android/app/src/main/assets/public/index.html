<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Al Harmain Travels</title>
  <meta name="theme-color" content="#0b4736">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #07261d;
      color: #faf8f4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo-box {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, rgba(11,71,54,0.4) 100%);
      border: 1.5px solid rgba(212,175,55,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
      animation: pulse-logo 2.5s ease-in-out infinite;
    }
    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); box-shadow: 0 16px 40px rgba(0,0,0,0.4); }
      50% { transform: scale(1.04); box-shadow: 0 20px 50px rgba(212,175,55,0.3); }
    }
    .brand-title {
      font-size: 20px;
      letter-spacing: 0.28em;
      color: #d4af37;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .brand-sub {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.65);
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .loader-ring {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(212,175,55,0.25);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-box">
    <svg width="48" height="48" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="44" stroke="#d4af37" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
      <polygon points="50,14 54.5,50 50,46 45.5,50" fill="#d4af37" />
      <polygon points="50,86 54.5,50 50,54 45.5,50" fill="#ffffff" opacity="0.85" />
      <polygon points="86,50 50,47 54,50 50,53" fill="#d4af37" opacity="0.7" />
      <polygon points="14,50 50,47 46,50 50,53" fill="#d4af37" opacity="0.7" />
      <circle cx="50" cy="50" r="5" fill="#07261d" stroke="#d4af37" stroke-width="2" />
    </svg>
  </div>
  <h1 class="brand-title">Al Harmain</h1>
  <p class="brand-sub">Luxury Chauffeur &bull; Makkah &bull; Madinah</p>
  <div class="loader-ring"></div>

  <script>
    window.location.replace('/');
  </script>
</body>
</html>
